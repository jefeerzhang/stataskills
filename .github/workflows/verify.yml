# CI 只跑 Stata-free 的静态验证层：GitHub-hosted runner 没有（也装不了）
# 商业软件 StataNow。执行层（真实跑 do-file）仍由本机
# `bash verify/run-verify.sh` 承担，见 docs/run-stata.md。
name: verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  static-verify:
    name: Static verify (Stata-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # harness 自身质量门：判定脚本必须过 shellcheck
      - name: Shellcheck harness
        run: shellcheck verify/lib/report.sh verify/lib/targets.sh verify/lib/judge.sh verify/lib/contract.sh verify/lib/community.sh verify/lib/prompt_corpus.sh verify/lib/prompt_plan.sh verify/run-verify.sh verify/test-harness.sh verify/test-targets.sh verify/test-contract.sh verify/test-community.sh verify/test-prompt-corpus.sh verify/test-prompt-plan.sh verify/check-claims.sh verify/test-prompts.sh

      # 判定逻辑回归测试（Stata-free）：直接喂构造日志给 verify/lib/judge.sh 断言，
      # 覆盖 r(9) 漏判 / sentinel 语义 / sentinel 掩盖真实错误；不依赖真实 Stata 或平台，
      # ubuntu-latest 即可跑。旧版 test-harness 未进 CI，且把 run-verify.sh 非零退出
      # 误当"捕获 r(9)"，导致 Linux 上假 PASS 在 GitHub 上不可见——此步骤让假阳性可被拦截。
      - name: Test harness (judge regression)
        run: bash verify/test-harness.sh

      # Target plan 回归（#20/#27）：普通入口 / multi-delegate；旧空格 API 已删除。
      - name: Test target plan
        run: bash verify/test-targets.sh

      # Community-package contract（#26）：center/ivreg2/weakivtest 漏检锁、
      # probe/sentinel/ownership 交叉校验。
      - name: Test community-package contract
        run: bash verify/test-community.sh

      # VERIFY CONTRACT + data locator 回归（#21/#25）：metadata、穷尽声明、
      # missing/unlisted/duplicate/CRLF、三类仓库路径。
      - name: Test contract and data locator
        run: bash verify/test-contract.sh

      # Prompt corpus adapters（#22）：双 adapter 对拍 + Dockerfile fixtures。
      - name: Test prompt corpus adapters
        run: bash verify/test-prompt-corpus.sh

      # Cross-skill prompt execution plan（#28）。
      - name: Test prompt plan
        run: bash verify/test-prompt-plan.sh

      # 静态层：version 政策 + 数据集存在 + manifest 登记 + manifest 双向一致性
      - name: Run static verify
        run: bash verify/run-verify.sh --static

      # 文档断言层：文件系统 facts 比对文档/结构计数，抓声明漂移
      - name: Check doc claims
        run: bash verify/check-claims.sh

      # Agent 行为回归测试（docs 层）：从实际目录动态审计 10 个 skill 与 route_branch 精确集合，
      # 逐条检查 expected_actions 语义锚点；expected_outputs 另做文档/日志关键词搜索。
      - name: Test prompts (dynamic routing docs layer)
        run: bash verify/test-prompts.sh
