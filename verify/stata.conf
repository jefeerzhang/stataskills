# ============================================================
# 平台二进制路径 —— 唯一来源（机器消费）
#
# 该文件是 Stata 可执行文件路径的事实来源（macOS / Windows 双平台）：
#   - verify/run-verify.sh 解析本文件，按平台选路径
#   - docs/run-stata.md 的命令形式说明引用本文件
#
# 改平台路径只改这里；新增平台在此追加一行。
# ============================================================

# macOS（本仓库验证环境：StataNow 19.5 MP，Apple Silicon）
STATA_MAC='/Applications/StataNow/StataMP.app/Contents/MacOS/stata-mp'

# Windows（StataNow 19 默认安装路径；其他版本改版本号）
STATA_WIN='C:\Program Files\StataNow19\StataMP-64.exe'
